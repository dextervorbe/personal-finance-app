<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./js/theme-init.js"></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/transactions.css">

  <title>Frontend Mentor | Personal finance app - Transactions</title>
</head>
<body>
  <aside class="sidebar" id="app-sidebar" aria-label="Application">
    <div class="sidebar__inner">
      <a class="sidebar__logo" href="index.html" aria-label="finance — home">
        <img class="sidebar__logo-img sidebar__logo-large" src="./assets/images/logo-large.svg" alt="" width="122" height="22">
        <img class="sidebar__logo-img sidebar__logo-small" src="./assets/images/logo-small.svg" alt="" width="14" height="22">
      </a>

      <nav class="sidebar__nav" aria-label="Primary">
        <ul class="sidebar__list">
          <li>
            <a href="index.html" class="sidebar__link">
              <span class="sidebar__icon">
                <img class="sidebar__icon-img" src="./assets/images/icon-nav-overview.svg" alt="" width="18" height="19">
              </span>
              <span class="sidebar__label">Overview</span>
            </a>
          </li>
          <li>
            <a href="transactions.html" class="sidebar__link" aria-current="page">
              <span class="sidebar__icon">
                <img class="sidebar__icon-img" src="./assets/images/icon-nav-transactions.svg" alt="" width="18" height="18">
              </span>
              <span class="sidebar__label">Transactions</span>
            </a>
          </li>
          <li>
            <a href="budgets.html" class="sidebar__link">
              <span class="sidebar__icon">
                <img class="sidebar__icon-img" src="./assets/images/icon-nav-budgets.svg" alt="" width="18" height="18">
              </span>
              <span class="sidebar__label">Budgets</span>
            </a>
          </li>
          <li>
            <a href="pots.html" class="sidebar__link">
              <span class="sidebar__icon">
                <img class="sidebar__icon-img" src="./assets/images/icon-nav-pots.svg" alt="" width="18" height="18">
              </span>
              <span class="sidebar__label">Pots</span>
            </a>
          </li>
          <li>
            <a href="recurring.html" class="sidebar__link">
              <span class="sidebar__icon">
                <img class="sidebar__icon-img" src="./assets/images/icon-nav-recurring-bills.svg" alt="" width="18" height="18">
              </span>
              <span class="sidebar__label">Recurring Bills</span>
            </a>
          </li>
        </ul>
      </nav>

      <button type="button" class="sidebar__theme" data-theme-toggle aria-label="Toggle color theme">
        <span class="sidebar__theme-icon-wrap" aria-hidden="true">
          <svg class="sidebar__theme-svg sidebar__theme-svg--sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.31 11.31 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.65 6.35l1.41-1.41"/>
          </svg>
          <svg class="sidebar__theme-svg sidebar__theme-svg--moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="sidebar__theme-label">Toggle theme</span>
      </button>

      <button type="button" class="sidebar__collapse" data-sidebar-toggle aria-expanded="true" aria-controls="app-sidebar">
        <span class="sidebar__collapse-icon" aria-hidden="true">
          <img src="./assets/images/icon-minimize-menu.svg" alt="" width="20" height="20">
        </span>
        <span class="sidebar__collapse-label">Minimize Menu</span>
      </button>
    </div>
  </aside>

  <div class="app-shell">
    <main id="main-content" class="transactions-page" aria-busy="true">
      <header class="transactions-page__header">
        <h1 class="transactions-page__title">Transactions</h1>
        <button type="button" class="transactions-add-btn">+ Add New Transaction</button>
      </header>

      <section class="transactions-panel" aria-labelledby="transactions-heading">
        <h2 id="transactions-heading" class="visually-hidden">Transaction list</h2>

        <div class="transactions-toolbar">
          <div class="transactions-search">
            <label class="visually-hidden" for="tx-search">Search transactions</label>
            <input type="search" id="tx-search" class="transactions-search__input" placeholder="Search transaction" autocomplete="off" spellcheck="false">
            <img class="transactions-search__icon" src="./assets/images/icon-search.svg" alt="" width="14" height="14">
          </div>

          <div class="transactions-filters">
            <label for="tx-sort">
              Sort by
              <select id="tx-sort" class="transactions-select">
                <option value="latest" selected>Latest</option>
                <option value="oldest">Oldest</option>
                <option value="az">A to Z</option>
                <option value="za">Z to A</option>
                <option value="highest">Highest</option>
                <option value="lowest">Lowest</option>
              </select>
            </label>
            <label for="tx-category">
              Category
              <select id="tx-category" class="transactions-select">
                <option value="">All Transactions</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Groceries">Groceries</option>
                <option value="Dining Out">Dining Out</option>
                <option value="Transportation">Transportation</option>
                <option value="Personal Care">Personal Care</option>
                <option value="Education">Education</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Shopping">Shopping</option>
                <option value="General">General</option>
              </select>
            </label>
          </div>
        </div>

        <div class="transactions-table-wrap">
          <table class="transactions-table">
            <thead>
              <tr>
                <th scope="col">Recipient / Sender</th>
                <th scope="col">Category</th>
                <th scope="col">Transaction Date</th>
                <th scope="col">Amount</th>
              </tr>
            </thead>
            <tbody id="transactions-tbody"></tbody>
          </table>
          <p id="transactions-empty" class="transactions-empty" hidden>No transactions match your filters.</p>
        </div>

        <nav class="transactions-pagination" id="tx-pagination" aria-label="Transaction pages">
          <button type="button" class="pagination-nav-btn" id="tx-prev" aria-label="Previous page">
            <img src="./assets/images/icon-caret-left.svg" alt="" width="6" height="11">
            Prev
          </button>
          <div class="transactions-pagination__pages" id="tx-pages" role="group" aria-label="Page"></div>
          <button type="button" class="pagination-nav-btn" id="tx-next" aria-label="Next page">
            Next
            <img src="./assets/images/icon-caret-right.svg" alt="" width="6" height="11">
          </button>
        </nav>
      </section>
    </main>
  </div>

  <script src="./js/theme.js" defer></script>
  <script src="./js/sidebar.js" defer></script>
  <script src="./js/transactions.js" defer></script>
</body>
</html>
